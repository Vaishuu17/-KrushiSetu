services:
  # Express Backend Web Service
  - type: web
    name: krushisetu-backend
    env: node
    rootDir: Final Project/server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # React Frontend Static Site
  - type: web
    name: krushisetu-frontend
    env: static
    rootDir: Final Project/client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://krushisetu-backend.onrender.com/api
